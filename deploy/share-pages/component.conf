# What installing the share pages means. Read by deploy/install.sh.
# See install.sh's header for the verbs; see README.md for what this is and why.

# The script uses global `fetch`, which arrived in Node 18. Reported, never
# installed: a deploy that changes the host's packages unasked is worse than one
# that stops and says what it needs.
require node 18 apt install nodejs

file share-pages.js /usr/local/bin/share-pages.js 0755

unit share-pages.service
unit share-pages.timer
unit share-pages-responder.service

enable share-pages-responder.service
enable share-pages.timer

# The responder is long-running: a new script only takes effect on a restart.
restart share-pages-responder.service

# Reconcile immediately rather than waiting up to the timer interval for the
# pages a just-deployed template change should already be rendering.
start share-pages.service
