# What installing the YouTube feed cache means. Read by deploy/install.sh.
# See install.sh's header for the verbs; see README.md for what this is and why.

file yt-feed-refresh.sh /usr/local/bin/yt-feed-refresh.sh 0755

unit yt-feed-cache.service
unit yt-feed-cache.timer

enable yt-feed-cache.timer

# Prime the cache when the component is first installed or changes, so the
# widget is not waiting on the timer's first tick for a feed it can serve.
start yt-feed-cache.service
