# What installing this site's web-server configuration means. Read by
# deploy/install.sh. See README.md for the one-time host bootstrap.

require caddy any apt install caddy

# The one-time per-host bootstrap, documented in README.md and nowhere else.
# Without the import line the file placed below is a file nothing reads, and the
# deploy would report success while the site ran on whatever was last
# hand-pasted into the shared Caddyfile.
bootstrap /etc/caddy/Caddyfile import sites/*.caddy

# Its own file under sites/. The main Caddyfile is never written by the deploy:
# other sites live in it, and a script that rewrites a shared file is how the
# four Caddyfile.bak-* files on the host came to exist.
file theneontemple.com.caddy /etc/caddy/sites/theneontemple.com.caddy 0644

# Validate the WHOLE resulting configuration before anything reloads it. On
# failure install.sh restores the previous file and fails the deploy — reloading
# an invalid config takes the site down, which is worse than not deploying.
validate caddy validate --config {root}/etc/caddy/Caddyfile

reload caddy
