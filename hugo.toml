baseURL = 'https://theneontemple.com/'
languageCode = 'en-us'
title = 'Neon Temple'
theme = 'terminal'
# No `relativeURLs`: URLs are emitted root-relative (`/css/style.<hash>.css`) so
# they resolve the same wherever a document is served from. Caddy serves
# 404.html for a missing path at ANY depth, and the share-page template is
# filled into /e/<id>/ and /a/<id>/ — page-relative hrefs broke the first and
# coupled the second to its own depth. `hugo server` rewrites baseURL, so local
# preview needs nothing here.

[params]
  description = 'A cybersecurity guild in Tampa Bay. Not a cult!'
  coterieAPI = 'https://coterie.theneontemple.com'
  portalURL = 'https://coterie.theneontemple.com/login'

  # Cloudflare Turnstile site key (PUBLIC — rendered in the join form). Empty =
  # no bot-challenge widget. Set to your Turnstile site key, or the always-pass
  # test key '1x00000000000000000000AA', to enable. Pair with the Coterie
  # backend secret (COTERIE__BOT_CHALLENGE__PROVIDER=turnstile + SECRET_KEY).
  turnstileSiteKey = '0x4AAAAAAD8gkrsteQF8o1Wz'

  # Social links
  email = 'info@theneontemple.com'
  facebook = ''
  twitter = ''
  youtube = ''
  instagram = ''

  # Address
  address = ''

[menus]
  [[menus.main]]
    name = 'Home'
    url = '/'
    weight = 1
  [[menus.main]]
    name = 'Calendar'
    url = '/calendar/'
    weight = 2
  [[menus.main]]
    name = 'Announcements'
    url = '/announcements/'
    weight = 3
  [[menus.main]]
    name = 'About'
    url = '/about/'
    weight = 4
  [[menus.main]]
    name = 'Join'
    url = '/join/'
    weight = 5
  [[menus.main]]
    name = 'Swag'
    url = 'https://www.ransomwear.store/collections/vault/Vault+vault'
    weight = 6
    [menus.main.params]
      external = true
  [[menus.main]]
    name = 'Login'
    url = 'https://coterie.theneontemple.com/login'
    weight = 7

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
